[workspace]
members = [
    "core_domain",
    "git_adapter",
    "gui_app",
    "keyring_adapter",
    "ssh_adapter",
    "auth_adapter",
    "config_adapter",
    "cache_adapter",
    "test_support",
    "app"
]
resolver = "2"

# Debug builds keep our own crates unoptimised for fast rebuilds and good backtraces, but
# optimise every dependency: iced's text shaping, tessellation, and gix are unusable at
# opt-level 0 and made the debug binary feel frozen.
[profile.dev.package."*"]
opt-level = 3

# Optimize for cross-platform release builds
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Unwind, not abort: background git work runs on worker threads (`gui_app::jobs::in_background`),
# and a worker that panics must end as an error for that one job, not take the window down.
# A panic on the UI thread still ends the program; the crash-report hook in `app` records it.
panic = "unwind"
strip = true
