name: resolver

# Cthulhu Resolve (.NET) only. The Rust workspace is not built here.
on:
  push:
    paths: ["resolver/**", ".github/workflows/resolver.yml"]
  pull_request:
    paths: ["resolver/**", ".github/workflows/resolver.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows (NTFS, File.Replace), macOS (case-insensitive APFS, NFD), Linux (ext4): spec §12.1, spike S4.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: resolver
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: resolver/global.json
      - run: git --version
      - run: dotnet test CthulhuResolve.slnx --configuration Release --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: resolver/tests/**/TestResults/*.trx
