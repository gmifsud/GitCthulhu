[package]
name = "gui_app"
version = "0.1.0"
edition = "2021"
description = "Iced-based GUI application"

[lib]
name = "gui_app"
path = "src/lib.rs"

# No adapter crates here: concrete adapters are wired by the `app` crate.
[dependencies]
core_domain = { path = "../core_domain" }
iced = { version = "0.13", features = ["advanced", "canvas"] } # Pure Rust reactive GUI; canvas draws the commit graph, advanced colours the terminal
rfd = "0.17.2"

[dev-dependencies]
test_support = { path = "../test_support" }

