<!-- @dsCard group="Overlays" height=300 subtitle="The merge dialog on its scrim" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dialog</title></head>
<body style="margin:0;background:var(--bg-app)">
<div class="gc-scrim">
  <div class="gc-dialog">
    <div class="gc-dialog__heading">Merge into main</div>
    <div class="gc-pick has-value"><span>feature/open-safety-session-routing</span><span class="gc-ico">&#xEAB4;</span></div>
    <label class="gc-check"><span class="gc-check__box is-on"><span class="gc-ico">&#xEAB2;</span></span>Always create a merge commit (--no-ff)</label>
    <div class="gc-dialog__note">If files conflict, the merge stays open: resolve them in the working tree, then Continue or Abort from the bar at the top.</div>
    <div class="gc-dialog__actions"><button class="gc-btn gc-btn--accent">Merge</button><button class="gc-btn">Cancel</button></div>
  </div>
</div>
</body></html>
