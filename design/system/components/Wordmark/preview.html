<!-- @dsCard group="Identity" height=120 subtitle="The five header marks" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Wordmark</title></head>
<body class="gc-chrome" style="margin:0;padding:14px 12px;font-family:var(--font-sans)">
<div style="display:flex;flex-wrap:wrap;gap:28px;align-items:center">
  <div><div class="gc-label">Two-tone wordmark</div><span class="gc-mark"><span class="gc-mark__git">Git</span><span class="gc-mark__cthulhu">Cthulhu</span></span></div>
  <div><div class="gc-label">Badge and name</div><span class="gc-mark"><span class="gc-mark__badge">G</span>GitCthulhu</span></div>
  <div><div class="gc-label">Spaced capitals</div><span class="gc-mark gc-mark--caps">G&#8201;I&#8201;T&#8201;C&#8201;T&#8201;H&#8201;U&#8201;L&#8201;H&#8201;U</span></div>
  <div><div class="gc-label">Shell prompt</div><span class="gc-mark gc-mark--prompt"><span class="gc-ico">&#xEAB6;</span>gitcthulhu</span></div>
  <div><div class="gc-label">Badge only</div><span class="gc-mark"><span class="gc-mark__badge" style="margin:0">G</span></span></div>
</div>
</body></html>
