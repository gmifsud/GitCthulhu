<html lang="en"><head><meta charset="utf-8"><title>Tooltip</title></head>

<div class="gc-row" style="gap:40px;align-items:flex-start">

  <div style="display:flex;flex-direction:column;align-items:flex-start;gap:4px">
    <span class="gc-tab is-active"><span><span class="gc-tab__name">GitCthulhu</span><span class="gc-tab__branch">main</span></span></span>
    <span class="gc-tip gc-tip--mono">D:\Repos\GitCthulhu
main</span>
  </div>
</div>
</body></html>
